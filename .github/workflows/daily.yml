name: daily

# Daily diamond finder: three-stage LLM gate, emails immediately on genuine finds.
# Stage-3 grounding: Booking.com (apidojo) via RAPIDAPI_KEY; falls back to LLM concierge.
# Set HOTEL_PROVIDER="" (repo variable) to force LLM-only grounding.

on:
  schedule:
    - cron: "0 6 */3 * *"   # 06:00 UTC every 3rd day-of-month (1,4,7,... not a rolling 72h clock)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deal-hunter-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # LLM_TOTAL_BUDGET_SECONDS=660 caps all LLM wall-clock time at 11 minutes; apidojo
    # grounding is ~13s total; 20 minutes leaves headroom over that plus pip install/checkout.
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
      LLM_PROVIDER:      ${{ vars.LLM_PROVIDER }}
      # Every llm-chain knob, passed through whether or not the repo variable exists, so any
      # of them can be retuned from the Actions UI with no code change. A knob MISSING from
      # this block fails SILENTLY: set in the UI, no effect on the run.
      #
      # The first four carry an explicit `|| <default>` rather than falling through to
      # llm_chain's own defaults, because llm_chain's defaults are flash-based and tuned for
      # a different repo's workload. Falling through would silently move every reasoning
      # stage off gemini-pro-latest -- a real quality change disguised as an unset variable.
      # These four values reproduce this repo's pre-migration behaviour exactly:
      # the chain is the old GEMINI_FALLBACK_MODEL_MAP ladder, and 3 attempts with a 5,15
      # backoff is the old _MAX_RETRIES/_RETRY_DELAYS policy.
      LLM_MODEL_CHAIN:          ${{ vars.LLM_MODEL_CHAIN        || 'gemini-pro-latest,gemini-flash-latest,gemini-3.1-flash-lite' }}
      LLM_SEARCH_MODEL_CHAIN:   ${{ vars.LLM_SEARCH_MODEL_CHAIN || 'gemini-3.1-flash-lite,gemini-flash-latest' }}
      LLM_ATTEMPTS_PER_MODEL:   ${{ vars.LLM_ATTEMPTS_PER_MODEL || '3' }}
      LLM_BACKOFF_SECONDS:      ${{ vars.LLM_BACKOFF_SECONDS    || '5,15' }}
      # Was config.RUN_BUDGET_SECONDS. Deliberately 660, not llm_chain's 1200 default:
      # 1200 would exceed this job's own 20-minute timeout.
      LLM_TOTAL_BUDGET_SECONDS: ${{ vars.LLM_TOTAL_BUDGET_SECONDS || '660' }}
      LLM_TIMEOUT_SECONDS:      ${{ vars.LLM_TIMEOUT_SECONDS }}
      LLM_RETRY_STATUSES:       ${{ vars.LLM_RETRY_STATUSES }}
      LLM_ADVANCE_STATUSES:     ${{ vars.LLM_ADVANCE_STATUSES }}
      LLM_RETRY_AFTER_CAP:      ${{ vars.LLM_RETRY_AFTER_CAP }}
      LLM_ANTHROPIC_MODEL:      ${{ vars.LLM_ANTHROPIC_MODEL }}
      SMTP_HOST:         ${{ secrets.SMTP_HOST }}
      SMTP_PORT:         ${{ secrets.SMTP_PORT }}
      SMTP_USER:         ${{ secrets.SMTP_USER }}
      SMTP_PASS:         ${{ secrets.SMTP_PASS }}
      EMAIL_TO:          ${{ secrets.EMAIL_TO }}
      EMAIL_FROM:        ${{ secrets.EMAIL_FROM }}
      RAPIDAPI_KEY:      ${{ secrets.RAPIDAPI_KEY }}
      HOTEL_PROVIDER:    ${{ vars.HOTEL_PROVIDER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt

      - name: Run find_city_anomalies.py (planner + web search)
        run: python find_city_anomalies.py

      - name: Persist state
        run: |
          git config user.name "deal-hunter"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git commit -m "update state [skip ci]" || echo "no changes"
          git pull --rebase origin main || echo "nothing to rebase"
          git push
