name: daily

# Daily diamond finder: three-stage LLM gate, emails immediately on genuine finds.
# Stage-3 grounding: Booking.com (apidojo) via RAPIDAPI_KEY; falls back to LLM concierge.
# Set HOTEL_PROVIDER="" (repo variable) to force LLM-only grounding.

on:
  schedule:
    - cron: "0 6 */3 * *"   # 06:00 UTC every 3rd day-of-month (1,4,7,... not a rolling 72h clock)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deal-hunter-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 30 minutes: llm_chain's LLM_TOTAL_BUDGET_SECONDS default is 1200 (20 min), and the
    # run still has to do apidojo hotel grounding (one HTTP round-trip per gate survivor)
    # and SMTP after the LLM work finishes. 15 minutes was shorter than the LLM budget
    # alone, so a chain exhaustion would have been killed by the job timeout instead of
    # returning a clean degraded run.
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
      LLM_PROVIDER:      ${{ vars.LLM_PROVIDER }}
      # Every llm_chain knob, passed through whether or not the repo variable exists: an
      # unset variable expands to "", which llm_chain resolves to its own default. All ten
      # are listed so any can be set from the Actions UI with no code change -- and because
      # a knob MISSING from this block fails SILENTLY: set in the UI, no effect on the run.
      LLM_MODEL_CHAIN:          ${{ vars.LLM_MODEL_CHAIN }}
      LLM_SEARCH_MODEL_CHAIN:   ${{ vars.LLM_SEARCH_MODEL_CHAIN }}
      LLM_ATTEMPTS_PER_MODEL:   ${{ vars.LLM_ATTEMPTS_PER_MODEL }}
      LLM_BACKOFF_SECONDS:      ${{ vars.LLM_BACKOFF_SECONDS }}
      LLM_TIMEOUT_SECONDS:      ${{ vars.LLM_TIMEOUT_SECONDS }}
      LLM_RETRY_STATUSES:       ${{ vars.LLM_RETRY_STATUSES }}
      LLM_ADVANCE_STATUSES:     ${{ vars.LLM_ADVANCE_STATUSES }}
      LLM_TOTAL_BUDGET_SECONDS: ${{ vars.LLM_TOTAL_BUDGET_SECONDS }}
      LLM_RETRY_AFTER_CAP:      ${{ vars.LLM_RETRY_AFTER_CAP }}
      LLM_ANTHROPIC_MODEL:      ${{ vars.LLM_ANTHROPIC_MODEL }}
      SMTP_HOST:         ${{ secrets.SMTP_HOST }}
      SMTP_PORT:         ${{ secrets.SMTP_PORT }}
      SMTP_USER:         ${{ secrets.SMTP_USER }}
      SMTP_PASS:         ${{ secrets.SMTP_PASS }}
      EMAIL_TO:          ${{ secrets.EMAIL_TO }}
      EMAIL_FROM:        ${{ secrets.EMAIL_FROM }}
      RAPIDAPI_KEY:      ${{ secrets.RAPIDAPI_KEY }}
      HOTEL_PROVIDER:    ${{ vars.HOTEL_PROVIDER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt

      - name: Run find_city_anomalies.py (planner + web search)
        run: python find_city_anomalies.py

      - name: Persist state
        run: |
          git config user.name "deal-hunter"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git commit -m "update state [skip ci]" || echo "no changes"
          git pull --rebase origin main || echo "nothing to rebase"
          git push
